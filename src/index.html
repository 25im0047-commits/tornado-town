<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8bcedb">
  <title>TORNADO TOWN — 竜巻で街をのみこもう</title>
  <style>/* INLINE_STYLE */</style>
</head>
<body>
  <main id="game" aria-label="トルネード・タウン">
    <canvas id="scene" tabindex="0" aria-label="ゲーム画面。WASDまたは矢印キーで移動、スペースで突風、Escで一時停止。画面のドラッグでも移動できます。"></canvas>
    <canvas id="arcadeFX" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <section id="intro" class="intro">
      <h1>TORNADO<span>TOWN</span></h1>
      <p class="tagline">巻き込むほど、大きくなる。</p>
      <p class="goal">2分30秒で、街の時計塔をのみこもう。</p>
      <button id="start" class="primary">はじめる <span aria-hidden="true">↗</span></button>
      <p class="intro-controls"><span class="keyboard"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 矢印キーで移動</span><span class="touch-copy">ドラッグで移動</span><span>近づくと自動で巻き込みます</span></p>
    </section>
    <div id="hud" hidden>
      <div class="top-left panel">
        <div class="level-line"><span class="storm-icon" aria-hidden="true">≋</span><strong id="level">サイズ 1</strong><span id="levelName">つむじ風</span></div>
        <div class="xp-track" role="progressbar" aria-label="次のサイズまで" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="xpFill"></div></div>
        <div id="nextTarget">巻き込めるもの：木・街灯</div>
      </div>
      <div class="destruction"><span>街の破壊率</span><strong><span id="destroyed">0</span><small>%</small></strong></div>
      <div class="top-right"><div id="timer" class="timer panel" aria-label="残り時間">2:30</div><button id="sound" class="icon-button" aria-label="音をオフにする" title="音をオフにする">音あり</button><button id="pause" class="icon-button" aria-label="一時停止" title="一時停止">Ⅱ</button></div>
      <div id="combo" class="combo" hidden><strong id="comboCount">2連続！</strong><span id="comboMode">続けて巻き込め！</span><div class="chain-track"><div id="chainFill"></div></div></div>
      <div class="map-wrap"><canvas id="minimap" width="300" height="300" aria-label="街の地図。白い印が竜巻、金色の印が時計塔です。"></canvas><span>時計塔 <b aria-hidden="true">◆</b></span></div>
      <p id="hint" class="hint"><span class="keyboard">WASD / 矢印で移動<span class="hint-sep">·</span>Space で突風</span><span class="touch-copy">ドラッグで移動</span></p>
      <button id="boost" class="boost" aria-label="突風を起こす"><span aria-hidden="true">↝</span><strong id="boostText">突風</strong><small id="boostKey">SPACE</small></button>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="pickup" class="pickup" aria-hidden="true"></div>
    <div id="joystick" class="joystick" hidden aria-hidden="true"><div id="stick"></div></div>
    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
      <div class="modal-card"><p id="modalEyebrow" class="eyebrow">ひと休み</p><h2 id="modalTitle">一時停止</h2><p id="modalBody"></p><div id="resultStats" class="result-stats" hidden></div><button id="resume" class="primary">つづける <span aria-hidden="true">→</span></button><button id="retry" class="secondary">最初から遊ぶ</button></div>
    </div>
    <div id="error" class="error" hidden><h2>ゲーム画面を開けませんでした</h2><p>3D描画に対応したChrome、Edge、Safariで開いてください。</p><p id="errorDetail"></p><button onclick="location.reload()">もう一度開く</button></div>
  </main>
  <script>/* INLINE_GAME */</script>
</body>
</html>
